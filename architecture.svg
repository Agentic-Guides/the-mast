<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2540"/>
      <stop offset="1" stop-color="#10152b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="54" fill="#ffd56b" font-size="36" font-weight="bold" text-anchor="middle">THE MAST</text>
  <text x="600" y="82" fill="#9aa5c8" font-size="16" text-anchor="middle">Your past self sets the rules. Your future self can't break them.</text>

  <!-- Flow: Human -> Constitution -> Ledger -> Agent -> Gate -->
  <!-- 1. Human / Guardian box (left) -->
  <rect x="30" y="160" width="200" height="150" rx="14" fill="url(#box)" stroke="#ffd56b" stroke-width="2"/>
  <text x="130" y="200" fill="#ffd56b" font-size="18" font-weight="bold" text-anchor="middle">Human</text>
  <text x="130" y="226" fill="#bfc8e8" font-size="13" text-anchor="middle">writes "constitution"</text>
  <text x="130" y="246" fill="#8fa0c4" font-size="12" text-anchor="middle">values + red lines</text>
  <text x="130" y="270" fill="#8fa0c4" font-size="12" text-anchor="middle">(ECDSA sign)</text>

  <!-- 2. Constitution Contract -->
  <rect x="280" y="160" width="200" height="150" rx="14" fill="url(#box)" stroke="#4ea6ff" stroke-width="2"/>
  <text x="380" y="200" fill="#4ea6ff" font-size="18" font-weight="bold" text-anchor="middle">Constitution</text>
  <text x="380" y="226" fill="#bfc8e8" font-size="13" text-anchor="middle">rules + quorum keys</text>
  <text x="380" y="246" fill="#8fa0c4" font-size="12" text-anchor="middle">sealed once</text>

  <!-- 3. Immutable Ledger -->
  <rect x="530" y="160" width="200" height="150" rx="14" fill="url(#box)" stroke="#5fd37b" stroke-width="2"/>
  <text x="630" y="200" fill="#5fd37b" font-size="18" font-weight="bold" text-anchor="middle">Ledger</text>
  <text x="630" y="226" fill="#bfc8e8" font-size="13" text-anchor="middle">SHA-256 hash chain</text>
  <text x="630" y="246" fill="#8fa0c4" font-size="12" text-anchor="middle">append-only</text>
  <text x="630" y="266" fill="#8fa0c4" font-size="12" text-anchor="middle">ECDSA signed</text>

  <!-- 4. Agent -->
  <rect x="780" y="160" width="200" height="150" rx="14" fill="url(#box)" stroke="#f0f4ff" stroke-width="2"/>
  <text x="880" y="200" fill="#f0f4ff" font-size="18" font-weight="bold" text-anchor="middle">Agent</text>
  <text x="880" y="226" fill="#bfc8e8" font-size="13" text-anchor="middle">Strands SDK</text>
  <text x="880" y="246" fill="#bfc8e8" font-size="13" text-anchor="middle">Bedrock AgentCore</text>

  <!-- 5. Execution Gate -->
  <rect x="1020" y="160" width="150" height="150" rx="14" fill="url(#box)" stroke="#ff5c5c" stroke-width="2"/>
  <text x="1095" y="200" fill="#ff5c5c" font-size="17" font-weight="bold" text-anchor="middle">Gate</text>
  <text x="1095" y="226" fill="#bfc8e8" font-size="12" text-anchor="middle">AWS Lambda</text>
  <text x="1095" y="246" fill="#ff5c5c" font-size="12" text-anchor="middle">REFUSE ⛔</text>

  <!-- Arrows -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#9aa5c8"/></marker></defs>
  <line x1="230" y1="235" x2="272" y2="235" stroke="#9aa5c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="235" x2="522" y2="235" stroke="#9aa5c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="235" x2="772" y2="235" stroke="#9aa5c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="235" x2="1014" y2="235" stroke="#9aa5c8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: any command -> gate refuses -->
  <rect x="280" y="420" width="650" height="120" rx="16" fill="url(#box)" stroke="#ff5c5c" stroke-width="2" filter="url(#glow)"/>
  <text x="605" y="458" fill="#ff5c5c" font-size="17" font-weight="bold" text-anchor="middle">⛔ ANY command, from ANYONE — even your future self</text>
  <text x="605" y="484" fill="#bfc8e8" font-size="14" text-anchor="middle">violates the constitution → the agent refuses</text>
  <text x="605" y="508" fill="#8fa0c4" font-size="12" text-anchor="middle">"By the constitution your past self sealed on 2024-06-14. Refused."</text>

  <line x1="605" y1="320" x2="605" y2="412" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- Bottom note -->
  <text x="605" y="590" fill="#5fd37b" font-size="14" font-weight="bold" text-anchor="middle">Human stays in control — forever. Even from yourself.</text>
  <text x="605" y="612" fill="#8fa0c4" font-size="12" text-anchor="middle">AWS Lambda execution gate + KMS signing + M-of-N guardian quorum (EIP-712)</text>

  <!-- Footer -->
  <text x="600" y="770" fill="#66709c" font-size="12" text-anchor="middle">THE MAST — AWS Agents for Humans · Good Neighbor track</text>
</svg>
