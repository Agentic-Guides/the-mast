<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" font-family="'Inter','Segoe UI',-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#0e0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="textg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161623"/>
      <stop offset="1" stop-color="#0f0f18"/>
    </linearGradient>
    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.55"/>
    </filter>
    <filter id="refuseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="40%" cy="-10%" r="90%">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bg wide enough for all content + glow margin -->
  <rect width="1000" height="1400" fill="url(#bg)"/>
  <rect width="1000" height="1400" fill="url(#halo)"/>

  <!-- Header -->
  <rect x="56" y="40" width="52" height="52" rx="13" fill="url(#accent)"/>
  <text x="82" y="74" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">M</text>
  <text x="124" y="70" fill="#fff" font-size="26" font-weight="700">THE MAST</text>
  <text x="124" y="92" fill="#9aa1b8" font-size="13" letter-spacing="1">CONSTITUTION-SEALED AGENT CONTROL</text>

  <!-- HERO (left aligned) -->
  <text x="56" y="190" fill="url(#textg)" font-size="48" font-weight="800" filter="url(#textGlow)">Your past self</text>
  <text x="56" y="248" fill="url(#textg)" font-size="48" font-weight="800" filter="url(#textGlow)">guards the future.</text>
  <text x="56" y="292" fill="#aab0cc" font-size="17" font-weight="600">Seal a constitution once. The agent refuses any</text>
  <text x="56" y="318" fill="#aab0cc" font-size="17" font-weight="600">command that breaks it — even from you.</text>

  <!-- ==== FLOW stacked vertically (mobile/PC safe) ==== -->

  <!-- Step 1 Human -->
  <rect x="56" y="370" width="888" height="172" rx="18" fill="url(#card)" stroke="#33334a" stroke-width="1.5" filter="url(#cardGlow)"/>
  <circle cx="118" cy="422" r="26" fill="url(#accent)"/>
  <text x="118" y="431" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text x="168" y="414" fill="#fff" font-size="24" font-weight="700">Human writes</text>
  <text x="168" y="446" fill="#c0c6dd" font-size="17">constitution of values + red lines</text>
  <rect x="168" y="472" width="150" height="38" rx="9" fill="#161622" stroke="#2a2a3c"/>
  <text x="243" y="496" fill="#fb7185" font-size="14" text-anchor="middle">ECDSA sign</text>

  <line x1="118" y1="550" x2="118" y2="585" stroke="url(#accent)" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Step 2 Ledger -->
  <rect x="56" y="590" width="888" height="172" rx="18" fill="url(#card)" stroke="#33334a" stroke-width="1.5" filter="url(#cardGlow)"/>
  <circle cx="118" cy="642" r="26" fill="url(#accent)"/>
  <text x="118" y="651" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text x="168" y="634" fill="#fff" font-size="24" font-weight="700">Constitution sealed</text>
  <text x="168" y="666" fill="#c0c6dd" font-size="17">append-only ledger = SHA-256 chain + ECDSA</text>
  <rect x="168" y="692" width="120" height="38" rx="9" fill="#161622" stroke="#2a2a3c"/>
  <text x="228" y="716" fill="#fb7185" font-size="14" text-anchor="middle">immutable</text>

  <line x1="118" y1="770" x2="118" y2="805" stroke="url(#accent)" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Step 3 Agent -->
  <rect x="56" y="810" width="888" height="172" rx="18" fill="url(#card)" stroke="#33334a" stroke-width="1.5" filter="url(#cardGlow)"/>
  <circle cx="118" cy="862" r="26" fill="url(#accent)"/>
  <text x="118" y="871" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text x="168" y="854" fill="#fff" font-size="24" font-weight="700">Agent executes</text>
  <text x="168" y="886" fill="#c0c6dd" font-size="17">Strands · Bedrock AgentCore · any command</text>
  <rect x="168" y="912" width="120" height="38" rx="9" fill="#161622" stroke="#2a2a3c"/>
  <text x="228" y="936" fill="#fb7185" font-size="14" text-anchor="middle">executed</text>

  <line x1="118" y1="990" x2="118" y2="1025" stroke="#e11d48" stroke-width="3" stroke-dasharray="7,4" marker-end="url(#arrr)"/>

  <!-- ==== REFUSE panel (money moment) ==== -->
  <rect x="56" y="1030" width="888" height="190" rx="18" fill="url(#card)" stroke="#e11d48" stroke-width="1.5" filter="url(#refuseGlow)"/>
  <text x="500" y="1078" fill="#fb7185" font-size="20" font-weight="800" text-anchor="middle">⛔ REFUSED</text>
  <text x="500" y="1112" fill="#c0c6dd" font-size="16" text-anchor="middle">any command, from anyone — even your future self</text>
  <text x="500" y="1140" fill="#aab0cc" font-size="14" text-anchor="middle">that violates the constitution is blocked at the gate</text>
  <text x="500" y="1184" fill="#7c8199" font-size="13" text-anchor="middle">"By the constitution your past self sealed on (date). Refused."</text>

  <!-- footer -->
  <text x="56" y="1300" fill="#e11d48" font-size="18" font-weight="700">Human stays in control — forever. Even from yourself.</text>
  <text x="56" y="1330" fill="#5a6080" font-size="13">AWS Lambda execution gate · AWS KMS · M-of-N guardian quorum (EIP-712) · Strands SDK · Bedrock AgentCore</text>

  <defs>
    <marker id="arr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0,0 12,5 0,10" fill="#a78bfa"/></marker>
    <marker id="arrr" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0,0 12,5 0,10" fill="#e11d48"/></marker>
  </defs>
</svg>
